<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23e8a24a'/%3E%3Crect x='1' y='1' width='6' height='7' fill='%23f4e3c3'/%3E%3Crect x='2' y='2' width='1' height='1' fill='%235fb0ff'/%3E%3Crect x='5' y='2' width='1' height='1' fill='%235fb0ff'/%3E%3Crect x='2' y='4' width='1' height='1' fill='%235fb0ff'/%3E%3Crect x='5' y='4' width='1' height='1' fill='%235fb0ff'/%3E%3Crect x='3' y='6' width='2' height='2' fill='%237a3d3a'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnSidebar" aria-label="Mostrar ou esconder o painel Escritório" title="Painel Escritório">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 3v10"/></svg>
    </button>
    <div class="brand">
      <canvas id="brandIcon" width="28" height="28" aria-hidden="true"></canvas>
      <div>
        <h1>AI Office</h1>
        <span class="sim-badge" id="simBadge" hidden>Simulação</span>
      </div>
    </div>
    <div class="stats" id="stats" aria-label="Resumo"></div>
    <div class="workers" id="workers" aria-label="Trabalhadores"></div>
    <button class="costs" id="costs" type="button" aria-label="Custos" title="Custos ao vivo — clique para detalhes"></button>
    <div class="tools">
      <button class="icon-btn" id="btnFit" title="Enquadrar o prédio" aria-label="Enquadrar o prédio">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      </button>
      <button class="icon-btn" id="btnZoomOut" title="Afastar" aria-label="Afastar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
      <button class="icon-btn" id="btnZoomIn" title="Aproximar" aria-label="Aproximar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
      <span class="sep"></span>
      <button class="icon-btn" id="btnCompare" title="Comparativo Claude × Codex" aria-label="Comparativo">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 14h12M4 12V8M8 12V3M12 12V6"/></svg>
      </button>
      <button class="icon-btn" id="btnSkills" title="Biblioteca de skills" aria-label="Skills">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2.5h7a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2zM3 11.5a2 2 0 0 1 2-2h7"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="Configurações" aria-label="Configurações">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="office" role="img" aria-label="Escritório em pixel art: cada sala é uma linha de trabalho"></canvas>
  </main>

  <aside class="float left" id="officePanel" aria-label="Escritório">
    <div class="float-head"><h2>Escritório</h2></div>
    <label class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="search" type="text" placeholder="Buscar linha, pasta ou IA" aria-label="Buscar" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="filters" id="filters"></div>
    <div class="new-line">
      <select id="tplSelect" aria-label="Modelo da nova linha"></select>
      <button class="btn primary" id="btnNewLine">+ Nova linha</button>
    </div>
    <div class="line-list" id="lineList"></div>
  </aside>

  <aside class="float right" id="panel" aria-live="polite" hidden></aside>

  <section class="float bottom" id="activity" aria-label="Atividade">
    <div class="float-head">
      <h2>Atividade</h2>
      <button class="icon-btn small" id="btnActivity" aria-label="Recolher atividade" aria-expanded="true">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
      </button>
    </div>
    <div class="feed" id="feed"></div>
  </section>

  <dialog id="modal" class="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" aria-label="Fechar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
