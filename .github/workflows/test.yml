name: testes

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes offline do CLI
        run: python3 scripts/test_scrape.py
      - name: Testes offline da interface com mapa
        run: python3 scripts/test_app.py
      - name: Sintaxe do script bash
        run: bash -n scripts/scrape.sh
